plugins {
    id 'com.android.application'
}

// Keep ContextCompat's pre-Android-13 receiver guard consistent with the renamed
// manifest permission. The factory fails the build if AndroidX changes this code.
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.instrumentation.transformClassesWith(
            app.streamy2.build.ReceiverPermissionVisitorFactory,
            com.android.build.api.instrumentation.InstrumentationScope.ALL) { }
    }
}

android {
    namespace 'app.streamy2'
    compileSdk 34

    defaultConfig {
        applicationId "app.streamy2"
        minSdk providers.gradleProperty('streamyMinSdk').map { it.toInteger() }.getOrElse(24)
        targetSdk 34
        versionCode 163
        versionName "3.43"
        vectorDrawables.useSupportLibrary = true
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    flavorDimensions += "device"
    productFlavors {
        tv {
            dimension "device"
            applicationId "app.streamy2"
            resValue "string", "app_name_variant", "Streamy 2 TV"
            buildConfigField "String", "UPDATE_CHANNEL", '"tv-new"'
        }
        mobile {
            dimension "device"
            applicationId "app.streamy2.mobile"
            versionCode 163
            versionName "3.43"
            resValue "string", "app_name_variant", "Streamy 2 Mobile"
            buildConfigField "String", "UPDATE_CHANNEL", '"mobile"'
        }
    }

    // Release credentials live outside Git. Debug builds use Android's local debug key.
    def releaseStore = providers.environmentVariable('STREAMY_KEYSTORE').orNull
    signingConfigs {
        release {
            if (releaseStore) {
                storeFile file(releaseStore)
                storePassword providers.environmentVariable('STREAMY_STORE_PASSWORD').orNull
                keyAlias providers.environmentVariable('STREAMY_KEY_ALIAS').getOrElse('streamy')
                keyPassword providers.environmentVariable('STREAMY_KEY_PASSWORD').orNull
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (releaseStore) signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix '.preview'
            versionNameSuffix '-preview'
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all { jvmArgs '--add-opens=java.base/java.io=ALL-UNNAMED' }
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
            pickFirsts += ['lib/**/libvlc.so', 'lib/**/libvlcjni.so', 'lib/**/libc++_shared.so']
        }
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/*.kotlin_module']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'org.bouncycastle:bcprov-jdk15to18:1.85'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'com.squareup.okhttp3:okhttp-tls:4.12.0'
    testImplementation files(rootProject.file('buildSrc/build/libs/buildSrc.jar'))
    testImplementation 'org.ow2.asm:asm:9.6'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.12.0'
    def media3Version = '1.11.1'
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-exoplayer-hls:$media3Version"
    implementation "androidx.media3:media3-ui:$media3Version"
    implementation "androidx.media3:media3-datasource:$media3Version"
    implementation "androidx.media3:media3-datasource-okhttp:$media3Version"
    implementation "androidx.media3:media3-common:$media3Version"
    implementation "androidx.media3:media3-extractor:$media3Version"
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.guava:guava:33.2.1-android'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
    implementation 'org.videolan.android:libvlc-all:3.6.0'
}
