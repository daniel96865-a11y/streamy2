name: Build Streamy 2 3.38

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build TV and Mobile release APKs
        run: ./gradlew --no-daemon :app:assembleTvRelease :app:assembleMobileRelease

      - name: Show APKs
        run: find app/build/outputs/apk -type f -name '*.apk' -print -exec sha256sum {} \;

      - name: Upload unsigned APKs
        uses: actions/upload-artifact@v4
        with:
          name: streamy2-3.38-unsigned
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Collect Android signing tools
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          BT="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          echo "Using build-tools: $BT"
          mkdir -p signing-tools/lib
          cp "$BT/apksigner" signing-tools/
          cp "$BT/zipalign" signing-tools/
          cp "$BT/lib/apksigner.jar" signing-tools/lib/
          chmod +x signing-tools/apksigner signing-tools/zipalign

      - name: Upload Android signing tools
        uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools
          path: signing-tools/
          if-no-files-found: error
          retention-days: 1
