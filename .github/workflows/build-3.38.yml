name: Build Streamy 2 3.38

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build TV and Mobile release APKs
        run: ./gradlew --no-daemon :app:assembleTvRelease :app:assembleMobileRelease

      - name: Show APKs
        run: find app/build/outputs/apk -type f -name '*.apk' -print -exec sha256sum {} \;

      - name: Upload unsigned APKs
        uses: actions/upload-artifact@v4
        with:
          name: streamy2-3.38-unsigned
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
