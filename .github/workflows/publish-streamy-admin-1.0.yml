name: Publish Streamy 2 Verwaltung 1.0

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/publish-streamy-admin-1.0.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct signed Verwaltung APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/streamy-admin
          git fetch origin publish/admin-app-1.0:refs/remotes/origin/publish/admin-app-1.0
          git show origin/publish/admin-app-1.0:.release-admin-1.0/verwaltung.apk.b64 | tr -d '\n\r' | base64 -d > /tmp/streamy-admin/Streamy2-Verwaltung-1.0.apk
          echo "bdffeb1e556c2fe3572770ee9f0082323e2481f564d0c959694cb3c9e49daede  /tmp/streamy-admin/Streamy2-Verwaltung-1.0.apk" | sha256sum -c -

      - name: Publish APK download
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/downloads
          cp /tmp/streamy-admin/Streamy2-Verwaltung-1.0.apk docs/downloads/Streamy2-Verwaltung-1.0.apk
          cp /tmp/streamy-admin/Streamy2-Verwaltung-1.0.apk docs/downloads/Streamy2-Verwaltung.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/downloads/Streamy2-Verwaltung-1.0.apk docs/downloads/Streamy2-Verwaltung.apk
          git commit -m "Publish Streamy 2 Verwaltung 1.0 APK"
          git push origin HEAD:main

      - name: Create Verwaltung release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/streamy-admin/notes.md <<'EOF'
          Streamy 2 Verwaltung 1.0

          - Separate Android-App für die Streamy-2-PIN-Verwaltung.
          - Öffnet direkt den geschützten Verwaltungsbereich.
          - Auf Handy und Android TV installierbar.
          - Kann parallel zu Streamy 2 installiert werden.
          - Eigene App-Signatur für künftige Verwaltungs-App-Updates.
          EOF
          if gh release view verwaltung-v1.0 >/dev/null 2>&1; then
            gh release upload verwaltung-v1.0 /tmp/streamy-admin/Streamy2-Verwaltung-1.0.apk --clobber
          else
            gh release create verwaltung-v1.0               /tmp/streamy-admin/Streamy2-Verwaltung-1.0.apk               --target main               --title "Streamy 2 Verwaltung 1.0"               --notes-file /tmp/streamy-admin/notes.md
          fi
