name: Neutralize public release notes

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/neutralize-release-notes.yml

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Neutralize public release descriptions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName'); do
            body="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body --jq '.body // ""')"
            new="$(printf '%s' "$body" | sed               -e 's/Vavoo/Live Extra/g'               -e 's/vavoo/Live Extra/g'               -e 's/Megakino/Media Extra/g'               -e 's/megakino/Media Extra/g')"
            if [ "$new" != "$body" ]; then
              printf '%s' "$new" > /tmp/release-notes.txt
              gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file /tmp/release-notes.txt
            fi
          done
