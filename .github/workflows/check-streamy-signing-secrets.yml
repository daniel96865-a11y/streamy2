name: Check Streamy signing secrets

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/check-streamy-signing-secrets.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check configured secret names
        shell: bash
        env:
          A: ${{ secrets.STREAMY_KEYSTORE_BASE64 }}
          B: ${{ secrets.STREAMY2_KEYSTORE_BASE64 }}
          C: ${{ secrets.STREAMY_KEYSTORE_B64 }}
          D: ${{ secrets.KEYSTORE_BASE64 }}
          E: ${{ secrets.STREAMY_STORE_PASSWORD }}
          F: ${{ secrets.STREAMY_KEY_PASSWORD }}
          G: ${{ secrets.STREAMY_KEY_ALIAS }}
          H: ${{ secrets.STREAMY2_STORE_PASSWORD }}
          I: ${{ secrets.STREAMY2_KEY_PASSWORD }}
          J: ${{ secrets.STREAMY2_KEY_ALIAS }}
          K: ${{ secrets.STREAMY_SIGNING_KEY }}
          L: ${{ secrets.STREAMY_SIGNING_KEY_BASE64 }}
        run: |
          for v in A B C D E F G H I J K L; do
            if [ -n "${!v}" ]; then echo "$v=yes"; else echo "$v=no"; fi
          done
