name: Build Streamy 2 Verwaltung

on:
  push:
    branches: [ feature/admin-app-1.0 ]
    paths:
      - adminapp/**
      - settings.gradle
      - .github/workflows/build-streamy-admin.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - name: Build Verwaltung release APK
        run: ./gradlew --no-daemon :adminapp:assembleRelease
      - name: Collect apksigner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-tools-export
          APKSIGNER_JAR="$(find "$ANDROID_HOME/build-tools" -path '*/lib/apksigner.jar' | sort -V | tail -1)"
          cp "$APKSIGNER_JAR" build-tools-export/apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: streamy2-verwaltung-1.0-unsigned
          path: |
            adminapp/build/outputs/apk/release/adminapp-release-unsigned.apk
            build-tools-export/apksigner.jar
          retention-days: 7
