name: Validate multi-playlists

on:
  push:
    branches:
      - feature/multi-playlists
    paths:
      - app/src/main/java/app/streamy2/Prefs.java
      - app/src/main/java/app/streamy2/CatalogCache.java
      - app/src/main/java/app/streamy2/PlaylistUiBinder.java
      - app/src/main/java/app/streamy2/App.java
      - app/src/test/java/app/streamy2/PlaylistProfilesTest.java
      - .github/workflows/validate-multi-playlists.yml
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Test profiles and build TV + Mobile
        run: ./gradlew --no-daemon :app:testTvDebugUnitTest :app:testMobileDebugUnitTest :app:assembleTvDebug :app:assembleMobileDebug
