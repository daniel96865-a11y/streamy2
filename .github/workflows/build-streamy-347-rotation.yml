name: Build Streamy 2 3.47 rotation

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/build-streamy-347-rotation.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - name: Test TV and Mobile
        run: ./gradlew --no-daemon :app:testTvDebugUnitTest :app:testMobileDebugUnitTest
      - name: Build Android 9+ TV and Mobile release APKs
        run: ./gradlew --no-daemon -PstreamyMinSdk=28 :app:assembleTvRelease :app:assembleMobileRelease
      - name: Collect apksigner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-tools-export
          APKSIGNER_JAR="$(find "$ANDROID_HOME/build-tools" -path '*/lib/apksigner.jar' | sort -V | tail -1)"
          test -n "$APKSIGNER_JAR"
          cp "$APKSIGNER_JAR" build-tools-export/apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: streamy2-3.47-android9-unsigned
          path: |
            app/build/outputs/apk/tv/release/app-tv-release-unsigned.apk
            app/build/outputs/apk/mobile/release/app-mobile-release-unsigned.apk
            build-tools-export/apksigner.jar
          retention-days: 7
