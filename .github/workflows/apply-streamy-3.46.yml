name: Apply Streamy 2 3.46 source

on:
  push:
    branches: [ release/3.46 ]
    paths:
      - .release-3.46/trigger

permissions:
  contents: write

jobs:
  apply-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/3.46
          fetch-depth: 0

      - name: Reconstruct 3.46 source overlay
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .release-3.46/overlay.b64 > /tmp/source346-overlay.tar.zst
          echo "3cefa4173c528a1b63a8866dcfcda260671914f47e15af7a416aa5f37214a199  /tmp/source346-overlay.tar.zst" | sha256sum -c -
          zstd -q -d /tmp/source346-overlay.tar.zst -o /tmp/source346-overlay.tar
          tar -xf /tmp/source346-overlay.tar
          grep -n 'versionCode 166' app/build.gradle
          grep -n 'versionName "3.46"' app/build.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run TV and Mobile unit tests
        run: ./gradlew --no-daemon :app:testTvDebugUnitTest :app:testMobileDebugUnitTest

      - name: Build TV and Mobile release APKs
        run: ./gradlew --no-daemon :app:assembleTvRelease :app:assembleMobileRelease

      - name: Collect signing verifier tool
        run: |
          mkdir -p build-tools-export
          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          cp "$BUILD_TOOLS_DIR/lib/apksigner.jar" build-tools-export/apksigner.jar

      - name: Show APKs
        run: find app/build/outputs/apk -type f -name '*.apk' -print -exec sha256sum {} \;

      - name: Upload unsigned APKs and verifier
        uses: actions/upload-artifact@v4
        with:
          name: streamy2-3.46-unsigned
          path: |
            app/build/outputs/apk/**/*.apk
            build-tools-export/apksigner.jar
          if-no-files-found: error
          retention-days: 7

      - name: Commit clean 3.46 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release-3.46
          rm -f .github/workflows/apply-streamy-3.46.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release Streamy 2 3.46 player update"
          git push origin HEAD:release/3.46
