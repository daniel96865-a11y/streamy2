name: Publish Streamy 2 3.48

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/publish-streamy-3.48.yml

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download successful 3.48 unsigned build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/streamy348
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/10695643482/zip > /tmp/streamy348/artifact.zip
          unzip -q /tmp/streamy348/artifact.zip -d /tmp/streamy348/artifact
          test -f /tmp/streamy348/artifact/app/build/outputs/apk/tv/release/app-tv-release-unsigned.apk
          test -f /tmp/streamy348/artifact/app/build/outputs/apk/mobile/release/app-mobile-release-unsigned.apk
          test -f /tmp/streamy348/artifact/build-tools-export/apksigner.jar

      - name: Reconstruct signed 3.48 APKs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin publish/3.48:refs/remotes/origin/publish/3.48
          git show origin/publish/3.48:.release-3.48/tv.patch.b64 | tr -d '\n\r' | base64 -d > /tmp/streamy348/tv.patch.zst
          git show origin/publish/3.48:.release-3.48/mobile.patch.b64 | tr -d '\n\r' | base64 -d > /tmp/streamy348/mobile.patch.zst

          echo "a75c18d8f256596fc18a98af2433dce31ed6d0b7cacfd864dc8ae6aa8f31ebb6  /tmp/streamy348/tv.patch.zst" | sha256sum -c -
          echo "a7aca7874b73f520e9958ac01603496eb947f98594d662a857b8f40e7d9fbdbe  /tmp/streamy348/mobile.patch.zst" | sha256sum -c -

          zstd -q -d --patch-from=/tmp/streamy348/artifact/app/build/outputs/apk/tv/release/app-tv-release-unsigned.apk /tmp/streamy348/tv.patch.zst -o /tmp/streamy348/Streamy2-TV-3.48.apk
          zstd -q -d --patch-from=/tmp/streamy348/artifact/app/build/outputs/apk/mobile/release/app-mobile-release-unsigned.apk /tmp/streamy348/mobile.patch.zst -o /tmp/streamy348/Streamy2-Mobile-3.48.apk

          echo "42de7f48fe6ebdababdd59e43080b31a43eae35ad0625b47529a38d584c62e91  /tmp/streamy348/Streamy2-TV-3.48.apk" | sha256sum -c -
          echo "bc644c2c2e2ae7fc30c7a6236c2bce6400fd3d9b1f2c24629ec9863336542730  /tmp/streamy348/Streamy2-Mobile-3.48.apk" | sha256sum -c -

      - name: Verify APK signer
        shell: bash
        run: |
          set -euo pipefail
          JAR=/tmp/streamy348/artifact/build-tools-export/apksigner.jar
          for apk in /tmp/streamy348/Streamy2-TV-3.48.apk /tmp/streamy348/Streamy2-Mobile-3.48.apk; do
            java -jar "$JAR" verify --verbose --print-certs "$apk" | tee /tmp/verify.txt
            grep -qi "Verified using v2 scheme.*true" /tmp/verify.txt
            grep -qi "3fc918ae654ba55e4ada86b8517f210fb148666982fd1a2d239495514b86a43f" /tmp/verify.txt
          done

      - name: Publish downloads and update feeds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/downloads
          cp /tmp/streamy348/Streamy2-TV-3.48.apk docs/downloads/
          cp /tmp/streamy348/Streamy2-Mobile-3.48.apk docs/downloads/

          cat > docs/streamy2-tv.json <<'EOF'
          {"versionCode":168,"versionName":"3.48","apkUrl":"https://raw.githubusercontent.com/daniel96865-a11y/streamy2/main/docs/downloads/Streamy2-TV-3.48.apk","changelog":"Neu in 3.48: Vavoo und Megakino sind ohne Freigabecode vollständig verborgen. Ein einmaliger 8-stelliger PIN schaltet die Zusatzfunktionen dauerhaft auf diesem Gerät frei. Freischaltung bleibt bis zur Deinstallation oder zum Löschen der App-Daten aktiv."}
          EOF
          cp docs/streamy2-tv.json docs/streamy2-tv.txt

          cat > docs/streamy2-mobile.json <<'EOF'
          {"versionCode":168,"versionName":"3.48","apkUrl":"https://raw.githubusercontent.com/daniel96865-a11y/streamy2/main/docs/downloads/Streamy2-Mobile-3.48.apk","changelog":"Neu in 3.48: Vavoo und Megakino sind ohne Freigabecode vollständig verborgen. Ein einmaliger 8-stelliger PIN schaltet die Zusatzfunktionen dauerhaft auf diesem Gerät frei. Freischaltung bleibt bis zur Deinstallation oder zum Löschen der App-Daten aktiv."}
          EOF
          cp docs/streamy2-mobile.json docs/streamy2-mobile.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/downloads/Streamy2-TV-3.48.apk docs/downloads/Streamy2-Mobile-3.48.apk docs/streamy2-tv.json docs/streamy2-tv.txt docs/streamy2-mobile.json docs/streamy2-mobile.txt
          git commit -m "Publish Streamy 2 3.48 updater APKs"
          git push origin HEAD:main

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/streamy348/notes.md <<'EOF'
          Streamy 2 3.48 – geschützte Zusatzfunktionen

          - Vavoo und Megakino sind standardmäßig vollständig verborgen.
          - In den Einstellungen gibt es nur die Freigabe per Zahlen-PIN.
          - Ein gültiger 8-stelliger Einmal-PIN kann nur einmal eingelöst werden.
          - Nach erfolgreicher Freigabe bleiben die Zusatzfunktionen auf diesem Gerät aktiv, bis die App deinstalliert oder die App-Daten gelöscht werden.
          - Vavoo-Player-Einstellungen und Megakino-Zugriffe sind ohne Freigabe ebenfalls gesperrt.
          - Verwaltungsbereich für das Erstellen und Sperren von PINs ist eingerichtet.
          - TV- und Mobile-Tests sowie Release-Builds erfolgreich.
          - Mit derselben Streamy-2-Release-Signatur wie 3.47 signiert.
          EOF

          if gh release view v3.48 >/dev/null 2>&1; then
            gh release upload v3.48 /tmp/streamy348/Streamy2-TV-3.48.apk /tmp/streamy348/Streamy2-Mobile-3.48.apk --clobber
          else
            gh release create v3.48               /tmp/streamy348/Streamy2-TV-3.48.apk               /tmp/streamy348/Streamy2-Mobile-3.48.apk               --target main               --title "Streamy 2 3.48 — geschützte Zusatzfunktionen"               --notes-file /tmp/streamy348/notes.md               --latest
          fi
