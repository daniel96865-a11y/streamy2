name: Prepare Streamy 2 3.46

on:
  push:
    branches: [ release/3.46 ]
    paths:
      - .github/workflows/prepare-streamy-3.46.yml

permissions:
  contents: write

jobs:
  prepare-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct 3.46 source files
        shell: bash
        run: |
          set -euo pipefail
          cat .release-3.46/source.part00 .release-3.46/source.part01 .release-3.46/source.part02 .release-3.46/source.part03 .release-3.46/source.part04 .release-3.46/source.part05 .release-3.46/source.part06 .release-3.46/source.part07 > /tmp/source-346.tar.zst.b64
          base64 -d /tmp/source-346.tar.zst.b64 > /tmp/source-346.tar.zst
          echo "62bd0db0afedbec94c7d064d1da7d84bc6289f949e00b11daa11a7183ca1779f  /tmp/source-346.tar.zst" | sha256sum -c -
          zstd -q -dc /tmp/source-346.tar.zst | tar -xf -
          rm -rf .release-3.46

      - name: Verify version
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode 166' app/build.gradle
          grep -q 'versionName "3.46"' app/build.gradle

      - name: Commit reconstructed source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare Streamy 2 3.46 player release"
          git push origin HEAD:release/3.46

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run TV and Mobile unit tests
        run: ./gradlew --no-daemon :app:testTvDebugUnitTest :app:testMobileDebugUnitTest

      - name: Build TV and Mobile release APKs
        run: ./gradlew --no-daemon :app:assembleTvRelease :app:assembleMobileRelease

      - name: Collect verifier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-tools-export
          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          cp "$BUILD_TOOLS_DIR/lib/apksigner.jar" build-tools-export/apksigner.jar
          find app/build/outputs/apk -type f -name '*.apk' -print -exec sha256sum {} \;

      - name: Upload unsigned APKs and verifier
        uses: actions/upload-artifact@v4
        with:
          name: streamy2-3.46-unsigned
          path: |
            app/build/outputs/apk/**/*.apk
            build-tools-export/apksigner.jar
          if-no-files-found: error
          retention-days: 7
