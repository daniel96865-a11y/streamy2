name: Repair Streamy 2 3.55 Mobile

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/repair-streamy-3.55-mobile.yml

permissions:
  contents: write
  actions: read

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download corrected Mobile 3.55 unsigned build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/streamy355fix
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/10733881907/zip > /tmp/streamy355fix/artifact.zip
          unzip -q /tmp/streamy355fix/artifact.zip -d /tmp/streamy355fix/artifact
          test -f /tmp/streamy355fix/artifact/app/build/outputs/apk/mobile/release/app-mobile-release-unsigned.apk
          test -f /tmp/streamy355fix/artifact/build-tools-export/apksigner.jar

      - name: Reconstruct corrected signed Mobile 3.55 APK
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin publish/3.55:refs/remotes/origin/publish/3.55
          git show origin/publish/3.55:.release-3.55/mobile.patch.b64 | tr -d '\n\r' | base64 -d > /tmp/streamy355fix/mobile.patch.zst

          echo "8115d6218ab0c95aafcd737aacc44d1b247be48e524a21b3349b8e1127966ce2  /tmp/streamy355fix/mobile.patch.zst" | sha256sum -c -

          zstd -q -d \
            --patch-from=/tmp/streamy355fix/artifact/app/build/outputs/apk/mobile/release/app-mobile-release-unsigned.apk \
            /tmp/streamy355fix/mobile.patch.zst \
            -o /tmp/streamy355fix/Streamy2-Mobile-3.55.apk

          echo "e3718bec5744fa245f0ded1ea9acbfec31a88378f3490c30f7a438191517ad8e  /tmp/streamy355fix/Streamy2-Mobile-3.55.apk" | sha256sum -c -

      - name: Verify corrected Mobile metadata and signature
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/streamy355fix/Streamy2-Mobile-3.55.apk
          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS_DIR/aapt" dump badging "$APK" | tee /tmp/streamy355fix/badging.txt
          grep -q "package: name='app.streamy2.mobile' versionCode='175' versionName='3.55'" /tmp/streamy355fix/badging.txt

          JAR=/tmp/streamy355fix/artifact/build-tools-export/apksigner.jar
          java -jar "$JAR" verify --verbose --print-certs "$APK" | tee /tmp/streamy355fix/verify.txt
          grep -qi "Verified using v3 scheme.*true" /tmp/streamy355fix/verify.txt
          grep -qi "9d7f061b552e04c4e257f59df209c0860d5fc095aa1fc25e782480a5b46761ce" /tmp/streamy355fix/verify.txt

      - name: Replace Mobile updater APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/downloads
          cp /tmp/streamy355fix/Streamy2-Mobile-3.55.apk docs/downloads/Streamy2-Mobile-3.55.apk

          cat > docs/streamy2-mobile.json <<'EOF'
          {"versionCode":175,"versionName":"3.55","apkUrl":"https://raw.githubusercontent.com/daniel96865-a11y/streamy2/main/docs/downloads/Streamy2-Mobile-3.55.apk","changelog":"Neu in 3.55: TV-PIN-Freigabe besser per Fernbedienung bedienbar, deutlich sichtbarer Fokus in den Player-Optionen und eine kompaktere Aktualisieren-Schaltfläche bei Media Extra."}
          EOF
          cp docs/streamy2-mobile.json docs/streamy2-mobile.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/downloads/Streamy2-Mobile-3.55.apk docs/streamy2-mobile.json docs/streamy2-mobile.txt
          if ! git diff --cached --quiet; then
            git commit -m "Repair Streamy 2 Mobile 3.55 updater APK"
            git push origin HEAD:main
          fi

      - name: Replace Mobile APK in GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload v3.55 /tmp/streamy355fix/Streamy2-Mobile-3.55.apk --clobber
