name: Publish Streamy 2 3.44

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/publish-streamy-3.44.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get 3.44 unsigned build and signature patches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/streamy344
          gh run download 35531856080 --repo "$GITHUB_REPOSITORY" --name streamy2-3.44-unsigned --dir /tmp/streamy344
          git fetch origin chore/publish-3.44:refs/remotes/origin/chore/publish-3.44
          for n in 00 01 02 03 04; do
            git show "origin/chore/publish-3.44:.release-3.44/tv_${n}.part"
          done > /tmp/streamy344/tv.patch.b64
          for n in 00 01 02 03 04; do
            git show "origin/chore/publish-3.44:.release-3.44/mobile_${n}.part"
          done > /tmp/streamy344/mobile.patch.b64
          base64 -d /tmp/streamy344/tv.patch.b64 > /tmp/streamy344/tv.patch.zst
          base64 -d /tmp/streamy344/mobile.patch.b64 > /tmp/streamy344/mobile.patch.zst

      - name: Reconstruct signed APKs
        run: |
          set -euo pipefail
          TV_UNSIGNED=/tmp/streamy344/app/build/outputs/apk/tv/release/app-tv-release-unsigned.apk
          MOBILE_UNSIGNED=/tmp/streamy344/app/build/outputs/apk/mobile/release/app-mobile-release-unsigned.apk
          mkdir -p /tmp/streamy344/signed
          zstd -q -d --patch-from="$TV_UNSIGNED" /tmp/streamy344/tv.patch.zst -o /tmp/streamy344/signed/Streamy2-TV-3.44.apk
          zstd -q -d --patch-from="$MOBILE_UNSIGNED" /tmp/streamy344/mobile.patch.zst -o /tmp/streamy344/signed/Streamy2-Mobile-3.44.apk
          echo "c4ab733495e7e9a055c7a579e5f066c622c1a99e01611e8091c1a49ead9adda8  /tmp/streamy344/signed/Streamy2-TV-3.44.apk" | sha256sum -c -
          echo "669971fdfd8de498e6e18f361f8a654cc1289d77a3fac2e69a47f00821279965  /tmp/streamy344/signed/Streamy2-Mobile-3.44.apk" | sha256sum -c -

      - name: Verify Streamy release signature
        run: |
          set -euo pipefail
          APKSIGNER=/tmp/streamy344/build-tools-export/apksigner.jar
          for apk in /tmp/streamy344/signed/*.apk; do
            java -jar "$APKSIGNER" verify --verbose --print-certs "$apk" | tee /tmp/verify.txt
            grep -q "Verified using v2 scheme.*true" /tmp/verify.txt
            grep -q "Verified using v3 scheme.*true" /tmp/verify.txt
            grep -qi "3fc918ae654ba55e4ada86b8517f210fb148666982fd1a2d239495514b86a43f" /tmp/verify.txt
          done

      - name: Publish direct updater APKs and feeds
        run: |
          set -euo pipefail
          mkdir -p docs/downloads
          cp /tmp/streamy344/signed/Streamy2-TV-3.44.apk docs/downloads/
          cp /tmp/streamy344/signed/Streamy2-Mobile-3.44.apk docs/downloads/
          cat > docs/streamy2-tv.json <<'EOF'
          {"versionCode":164,"versionName":"3.44","apkUrl":"https://raw.githubusercontent.com/daniel96865-a11y/streamy2/main/docs/downloads/Streamy2-TV-3.44.apk","changelog":"Neu in 3.44: AndroidX Media3 1.11.1, schnelleres Live-TV-Zapping, bessere Pufferung und erweiterte Player-Diagnose mit Exo-zu-VLC-Fallback."}
          EOF
          cp docs/streamy2-tv.json docs/streamy2-tv.txt
          cat > docs/streamy2-mobile.json <<'EOF'
          {"versionCode":164,"versionName":"3.44","apkUrl":"https://raw.githubusercontent.com/daniel96865-a11y/streamy2/main/docs/downloads/Streamy2-Mobile-3.44.apk","changelog":"Neu in 3.44: AndroidX Media3 1.11.1, schnelleres Live-TV-Zapping, bessere Pufferung und erweiterte Player-Diagnose mit Exo-zu-VLC-Fallback."}
          EOF
          cp docs/streamy2-mobile.json docs/streamy2-mobile.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/downloads/Streamy2-TV-3.44.apk docs/downloads/Streamy2-Mobile-3.44.apk docs/streamy2-tv.json docs/streamy2-tv.txt docs/streamy2-mobile.json docs/streamy2-mobile.txt
          git commit -m "Publish Streamy 2 3.44 updater APKs"
          git push origin HEAD:main

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v3.44 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v3.44 --repo "$GITHUB_REPOSITORY" --clobber               /tmp/streamy344/signed/Streamy2-TV-3.44.apk               /tmp/streamy344/signed/Streamy2-Mobile-3.44.apk
          else
            gh release create v3.44 --repo "$GITHUB_REPOSITORY" --target main               --title "Streamy 2 3.44 — Media3 Live-TV Update"               --notes "Streamy 2 3.44 für TV und Mobile. Neu: AndroidX Media3 1.11.1, schnelleres Live-TV-Zapping, optimierte Standard-Pufferung, detaillierte Playback-Diagnose und dokumentierter Exo→VLC-Auto-Fallback. Beide APKs behalten die bestehende Streamy-Release-Signatur."               /tmp/streamy344/signed/Streamy2-TV-3.44.apk               /tmp/streamy344/signed/Streamy2-Mobile-3.44.apk
          fi

      - name: Remove temporary publish branch
        if: success()
        run: git push origin --delete chore/publish-3.44 || true
