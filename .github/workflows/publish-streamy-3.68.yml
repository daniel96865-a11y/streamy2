name: Publish Streamy 2 3.68

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/publish-streamy-3.68.yml

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download tested 3.68 unsigned build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/streamy368
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/10791472176/zip > /tmp/streamy368/artifact.zip
          unzip -q /tmp/streamy368/artifact.zip -d /tmp/streamy368/artifact
          test -f /tmp/streamy368/artifact/app/build/outputs/apk/tv/release/app-tv-release-unsigned.apk
          test -f /tmp/streamy368/artifact/app/build/outputs/apk/mobile/release/app-mobile-release-unsigned.apk
          test -f /tmp/streamy368/artifact/build-tools-export/apksigner.jar

      - name: Reconstruct and verify signed APK bytes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin publish/3.68:refs/remotes/origin/publish/3.68

          git ls-tree -r --name-only origin/publish/3.68 '.release-3.68/tv' | sort | while read -r p; do git show "origin/publish/3.68:$p"; done | tr -d '\n\r' | base64 -d > /tmp/streamy368/tv.patch.zst
          git ls-tree -r --name-only origin/publish/3.68 '.release-3.68/mobile' | sort | while read -r p; do git show "origin/publish/3.68:$p"; done | tr -d '\n\r' | base64 -d > /tmp/streamy368/mobile.patch.zst

          echo '836ef37c7bc195d28be50fd68da5fa2a65f364b0c4d0f0157f4eeaad87f557ea  /tmp/streamy368/tv.patch.zst' | sha256sum -c -
          echo 'd40c3f4418623da29340bfbb51b3890e103342a9aef141c53a76ed172f45c23a  /tmp/streamy368/mobile.patch.zst' | sha256sum -c -

          zstd -q -d --patch-from=/tmp/streamy368/artifact/app/build/outputs/apk/tv/release/app-tv-release-unsigned.apk /tmp/streamy368/tv.patch.zst -o /tmp/streamy368/Streamy2-TV-3.68.apk
          zstd -q -d --patch-from=/tmp/streamy368/artifact/app/build/outputs/apk/mobile/release/app-mobile-release-unsigned.apk /tmp/streamy368/mobile.patch.zst -o /tmp/streamy368/Streamy2-Mobile-3.68.apk

          echo '90cb621bffc956e3e0a28fd3f971f651e2503f4c1d208e7bb9416008adcd0db8  /tmp/streamy368/Streamy2-TV-3.68.apk' | sha256sum -c -
          echo '0c7bf8bb2ffa38876a37c675b0af17327ad074e2c20595b15005adb7e55b6a3b  /tmp/streamy368/Streamy2-Mobile-3.68.apk' | sha256sum -c -

      - name: Verify package versions and installed-app signer
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          JAR=/tmp/streamy368/artifact/build-tools-export/apksigner.jar
          "$BUILD_TOOLS_DIR/aapt" dump badging /tmp/streamy368/Streamy2-TV-3.68.apk | grep -q "package: name='app.streamy2' versionCode='188' versionName='3.68'"
          "$BUILD_TOOLS_DIR/aapt" dump badging /tmp/streamy368/Streamy2-Mobile-3.68.apk | grep -q "package: name='app.streamy2.mobile' versionCode='188' versionName='3.68'"
          for apk in /tmp/streamy368/Streamy2-TV-3.68.apk /tmp/streamy368/Streamy2-Mobile-3.68.apk; do
            java -jar "$JAR" verify --verbose --print-certs "$apk" > /tmp/streamy368/verify.txt
            grep -qi 'Verified using v2 scheme.*true' /tmp/streamy368/verify.txt
            grep -qi 'Verified using v3 scheme.*true' /tmp/streamy368/verify.txt
            grep -qi '3fc918ae654ba55e4ada86b8517f210fb148666982fd1a2d239495514b86a43f' /tmp/streamy368/verify.txt
          done

      - name: Publish downloads and updater feeds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/downloads
          cp /tmp/streamy368/Streamy2-TV-3.68.apk docs/downloads/
          cp /tmp/streamy368/Streamy2-Mobile-3.68.apk docs/downloads/

          cat > docs/streamy2-tv.json <<'EOF'
          {"versionCode":188,"versionName":"3.68","apkUrl":"https://raw.githubusercontent.com/daniel96865-a11y/streamy2/main/docs/downloads/Streamy2-TV-3.68.apk","changelog":"3.68 stellt Live Extra/Vavoo wieder her: direkte Vavoo-Anmeldung, unveränderte Server-Signatur und saubere Resolve-Wiederholung bei 401/403. Der Audio-Fix aus 3.67 bleibt enthalten."}
          EOF
          cp docs/streamy2-tv.json docs/streamy2-tv.txt

          cat > docs/streamy2-mobile.json <<'EOF'
          {"versionCode":188,"versionName":"3.68","apkUrl":"https://raw.githubusercontent.com/daniel96865-a11y/streamy2/main/docs/downloads/Streamy2-Mobile-3.68.apk","changelog":"3.68 stellt Live Extra/Vavoo wieder her: direkte Vavoo-Anmeldung, unveränderte Server-Signatur und saubere Resolve-Wiederholung bei 401/403. Der Audio-Fix aus 3.67 bleibt enthalten."}
          EOF
          cp docs/streamy2-mobile.json docs/streamy2-mobile.txt

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/downloads/Streamy2-TV-3.68.apk docs/downloads/Streamy2-Mobile-3.68.apk docs/streamy2-tv.json docs/streamy2-tv.txt docs/streamy2-mobile.json docs/streamy2-mobile.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Publish Streamy 2 3.68 updater APKs'
            git push origin HEAD:main
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/streamy368/notes.md <<'EOF'
          Streamy 2 3.68 — Live Extra/Vavoo Hotfix

          - Stellt den direkten Vavoo-Anmeldeweg wieder her.
          - Verwendet die vom Server gelieferte Signatur unverändert.
          - Erneuert die Signatur beim Resolve gezielt bei HTTP 401/403.
          - Der automatische Audio-/Tonspur-Fix aus 3.67 bleibt enthalten.
          - TV und Mobile: Version 3.68 / Build 188, gleiche Release-Signatur wie 3.38–3.67.
          EOF

          if gh release view v3.68 >/dev/null 2>&1; then
            gh release upload v3.68 /tmp/streamy368/Streamy2-TV-3.68.apk /tmp/streamy368/Streamy2-Mobile-3.68.apk --clobber
          else
            gh release create v3.68               /tmp/streamy368/Streamy2-TV-3.68.apk               /tmp/streamy368/Streamy2-Mobile-3.68.apk               --target main               --title 'Streamy 2 3.68 — Live Extra/Vavoo Hotfix'               --notes-file /tmp/streamy368/notes.md               --latest
          fi
