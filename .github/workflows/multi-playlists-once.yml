name: Integrate multi-playlist UI once

on:
  push:
    branches:
      - feature/multi-playlists
    paths:
      - .github/workflows/multi-playlists-once.yml

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/multi-playlists
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Patch playlist switcher and TV focus UI
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py

      - name: Run tests and build both device variants
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:testTvDebugUnitTest :app:testMobileDebugUnitTest :app:assembleTvDebug :app:assembleMobileDebug

      - name: Commit tested integration
        run: |
          git config user.name "daniel96865-a11y"
          git config user.email "daniel96865@googlemail.com"
          git add app/src/main/java/app/streamy2/MainActivity.java app/src/main/res/layout/activity_main.xml
          git commit -m "Add multi-playlist switcher for TV and mobile [skip ci]"
          git push origin HEAD:feature/multi-playlists
